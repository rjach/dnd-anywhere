<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Many inputs</title>
    <link rel="stylesheet" href="common.css" />
    <script src="common.js"></script>
  </head>
  <body>
    <h1>Fifty upload fields</h1>
    <div id="list"></div>
    <p id="result"></p>
    <script>
      const list = document.getElementById("list");
      for (let index = 0; index < 50; index += 1) {
        const row = document.createElement("p");
        row.innerHTML = `<label>Document ${index + 1} <input type="file" name="doc${index}"></label>`;
        row
          .querySelector("input")
          .addEventListener("change", (event) => showFiles(event.target.files, `doc${index}:`));
        list.append(row);
      }
      // Filler content so the page has realistic size.
      for (let index = 0; index < 2000; index += 1) list.append(document.createElement("span"));
    </script>
  </body>
</html>
