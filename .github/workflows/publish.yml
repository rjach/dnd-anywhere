name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and attest, but don't submit to stores
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build release zips
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter extension test
      - name: Build zips (Chrome, Edge, Firefox + sources)
        run: pnpm zip
      - name: Guards
        run: pnpm check:network && pnpm check:manifest && pnpm check:size
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: extension/.output/*.zip
      - name: Attach zips to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" extension/.output/*.zip --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zips
          path: extension/.output/*.zip

  submit:
    name: Submit to stores
    needs: build
    if: github.event_name == 'release' || inputs.dry-run == false
    runs-on: ubuntu-latest
    # Requires a maintainer's approval in the store-publish environment.
    environment: store-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zips
          path: zips
      - name: Submit
        working-directory: extension
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          shopt -s nullglob
          args=()
          [ -n "$CHROME_EXTENSION_ID" ] && args+=(--chrome-zip ../zips/*-chrome.zip)
          [ -n "$EDGE_PRODUCT_ID" ] && args+=(--edge-zip ../zips/*-edge.zip)
          [ -n "$FIREFOX_EXTENSION_ID" ] && args+=(--firefox-zip ../zips/*-firefox.zip --firefox-sources-zip ../zips/*-sources.zip)
          if [ ${#args[@]} -eq 0 ]; then echo "No store secrets configured; nothing to submit."; exit 0; fi
          pnpm exec wxt submit "${args[@]}"
