name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build, guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests with coverage
        run: pnpm --filter extension coverage
      - name: Build Chrome and Firefox
        run: pnpm build
      - name: No network calls in the bundle
        run: pnpm check:network
      - name: Manifest permissions unchanged
        run: pnpm check:manifest
      - name: Bundle size budget
        run: pnpm check:size
      - name: Licenses of shipped dependencies
        run: pnpm check:licenses
      - name: Build the website
        run: pnpm site:build
