name: Bug report
description: Something in DnD Anywhere itself is broken (not specific to one site).
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: Toolbar button → "Copy diagnostic report". Turn on "Debug logging" in Options for console logs prefixed [dnd-anywhere].
      render: text
  - type: input
    id: version
    attributes:
      label: Extension version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, version and OS
      placeholder: Chrome 141 on macOS 26
    validations:
      required: true
